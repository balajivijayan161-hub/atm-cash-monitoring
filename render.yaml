# Render Blueprint: web service + Postgres.
# Free-plan names below match Render's blueprint schema. If your account
# no longer offers a free Postgres, create a Neon database and set DATABASE_URL
# on the web service instead. The app only needs a Postgres connection string.

databases:
  - name: atm-cash-db
    plan: free
    databaseName: atm_cash
    user: atm_cash_user

services:
  - type: web
    name: atm-cash-monitoring
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: atm-cash-db
          property: connectionString
      - key: SWITCH_POLL_MS
        value: "300000"
      - key: CASH_ALERT_PCT
        value: "20"
      - key: OFFLINE_MINUTES
        value: "2"
      - key: SIMULATOR_TICK_MS
        value: "4000"
      - key: SIMULATOR_MAX_MS
        value: "900000"
      - key: SESSION_SECRET
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: DEMO_PASSWORD
        sync: false
      - key: SETUP_TOKEN
        sync: false
      - key: ADMIN_RECOVERY
        sync: false
